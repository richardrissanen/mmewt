<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Mutable Mobile Events Web Template">
    <meta name="author" content="Richard Rissanen">
    <title>MMEWT</title>
    <link rel="stylesheet" href="./css/site.css">
    <link href="http://fonts.googleapis.com/css?family=Roboto:100,300,400,700" rel="stylesheet">
  </head>
  <body>
    <header class="top-header">
      <a id="logo" class="navbar-brand" href="index.html">MMEWT</a>
    </header>

    <main role="main" class="container">
      <div id="aria-status" class="sr-only" aria-live="polite"></div>
      <ul id="events" class="list-group"></ul>
      <p class="text-muted text-center"><small>MMEWT is open source.<br/>You can find the code <a href="https://github.com/richardrissanen/mmewt">here.</a></small></p>
    </main>

    <nav class="navbar bottom-nav">
      <div id="tools">
        <div id="tool-tabs">
          <input type="radio" id="tab-all" name="tab" value="all" checked>
          <label for="tab-all" class="tool-link">All</label>
          <input type="radio" id="tab-favorites" name="tab" value="favorites">
          <label for="tab-favorites" class="tool-link">Favorites</label>
          <input type="radio" id="tab-up-next" name="tab" value="up-next">
          <label for="tab-up-next" class="tool-link">Up Next</label>
          <form id="search-form" onsubmit="return false;">
            <input id="search" class="form-control" type="search" placeholder="Search events" aria-label="Search">
          </form>
        </div>
      </div>
    </nav>
    <script src="data/events.js"></script>
    <script src="js/vanilla.js"></script>
  </body>
</html>
